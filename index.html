<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Mobility</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#EBF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1817" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* Layout: one calm column for the phone, bottom tab bar, full-screen guided player with a breathing ring */
:root{
  --bg:#EBF0EE; --surface:#F7FAF9; --surface-2:#E0E8E5; --ink:#1C2A29; --muted:#5B6C69; --line:#D0DBD7;
  --accent:#3D7C74; --accent-ink:#FFFFFF; --accent-soft:#D3E5E0;
  --dusk:#6F7BB0; --dusk-soft:#DEE1F0; --moss:#7C8A4E; --moss-soft:#E4E8D3;
  --warn:#9A6A2E; --warn-soft:#F3E7D3;
  --shadow:0 1px 2px rgba(28,42,41,.06),0 8px 24px rgba(28,42,41,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1817; --surface:#162221; --surface-2:#1E2D2B; --ink:#E4EEEB; --muted:#93A6A2; --line:#263836; --accent:#6DB3A8; --accent-ink:#0C1514; --accent-soft:#1E3B37;
  --dusk:#9BA6DA; --dusk-soft:#252B45; --moss:#AAB878; --moss-soft:#2A3120;
  --warn:#D9A866; --warn-soft:#352A1A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1817; --surface:#162221; --surface-2:#1E2D2B; --ink:#E4EEEB; --muted:#93A6A2;
  --line:#263836; --accent:#6DB3A8; --accent-ink:#0C1514; --accent-soft:#1E3B37;
  --dusk:#9BA6DA; --dusk-soft:#252B45; --moss:#AAB878; --moss-soft:#2A3120;
  --warn:#D9A866; --warn-soft:#352A1A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{font-size:1.65rem;line-height:1.2}
.top p{color:var(--muted);margin-top:4px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;padding:0 14px;font-size:.85rem;font-weight:600;white-space:nowrap}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 0;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg small{font-weight:500;font-size:.75rem;margin-left:2px}

.hint{display:flex;gap:12px;align-items:flex-start;background:var(--dusk-soft);border-radius:var(--r);padding:14px 16px;font-size:.88rem}
.hint b{font-weight:700}
.hint .x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:1.2rem;line-height:1;padding:2px 4px}

.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;justify-content:space-between;align-items:baseline}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.rcard{position:relative;text-align:left;border:0;background:var(--surface);border-radius:var(--r);padding:16px 16px 14px 20px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.rcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--tone,var(--accent))}
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rname{font-family:var(--f-display);font-size:1.08rem;font-weight:500}
.rtime{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rdesc{color:var(--muted);font-size:.9rem}
.rmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.add-card{border:1.5px dashed var(--line);background:transparent;border-radius:var(--r);padding:16px;color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:transparent;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* library */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.84rem;font-weight:600;white-space:nowrap;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex{background:var(--surface);border-radius:14px}
.ex summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
.ex summary::-webkit-details-marker{display:none}
.ex summary .n{font-weight:600}
.ex summary .m{font-size:.8rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ex .body{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.tip{color:var(--accent);font-weight:600;font-size:.86rem}
.list{display:flex;flex-direction:column;gap:8px}

/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:.76rem;color:var(--muted);font-weight:600}
.cal{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:.7rem;text-align:center;color:var(--muted);font-weight:700}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .d.l1{background:var(--accent-soft);color:var(--ink)}
.cal .d.l2{background:color-mix(in srgb,var(--accent) 55%,var(--accent-soft));color:var(--accent-ink)}
.cal .d.l3{background:var(--accent);color:var(--accent-ink)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .d.fut{opacity:.35}
.hrow{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border-radius:14px;padding:12px 16px}
.hrow .t{font-weight:600}
.hrow .s{font-size:.82rem;color:var(--muted)}
.hrow .r{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.empty{background:var(--surface);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,18,17,.38);z-index:30;opacity:0;transition:opacity .25s}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
.sheet h2{font-size:1.4rem}
.note{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:.86rem}
.note b{color:var(--warn)}
.steps{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);padding:4px 16px}
.steps .row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.steps .row:last-child{border-bottom:0}
.steps .row span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.88rem}
.btn{border:0;border-radius:16px;padding:16px;font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink);width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.field{display:flex;flex-direction:column;gap:6px}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink)}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 10px 10px 14px}
.pick .n{font-weight:600;font-size:.92rem}
.pick .a{font-size:.76rem;color:var(--muted)}
.pick button{border:0;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:1.2rem;font-weight:700;flex:none}
.pick.sel button{background:var(--surface-2);color:var(--muted)}
.pick .ord{font-family:var(--f-display);color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums}

/* player */
.player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto}
.player .in{flex:1;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.pbar{display:flex;align-items:center;gap:8px}
.pbar .ttl{flex:1;min-width:0;font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.round svg{width:18px;height:18px}
.round[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.prog{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s linear}
.phase{text-align:center;font-size:.76rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.phase.prep{color:var(--dusk)}
.exname{text-align:center;font-size:1.6rem;line-height:1.2}
.ringwrap{position:relative;width:min(64vw,250px);aspect-ratio:1;max-width:100%;margin:4px auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .trk{fill:none;stroke:var(--surface-2);stroke-width:10}
.ringwrap .val{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ringwrap.prep .val{stroke:var(--dusk)}
.ringwrap .breath{position:absolute;inset:18%;border-radius:50%;background:var(--accent-soft);animation:breathe 10s ease-in-out infinite}
.ringwrap.prep .breath{background:var(--dusk-soft)}
.ringwrap .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .num b{font-family:var(--f-display);font-weight:500;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.ringwrap .num span{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:4px}
@keyframes breathe{0%,100%{transform:scale(.82)}50%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ringwrap .breath{animation:none}.sheet,.backdrop{transition:none}}
.how{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.nextup{font-size:.85rem;color:var(--muted);text-align:center}
.nextup b{color:var(--ink)}
.ctrls{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:auto;padding-top:6px}
.ctrls .round{width:54px;height:54px}
.ctrls .main{width:76px;height:76px;background:var(--accent);color:var(--accent-ink);border:0}
.ctrls .main svg{width:30px;height:30px}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.confirm .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm .btn{padding:12px}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.done h2{font-size:1.8rem}
.done .big{font-family:var(--f-display);font-size:3rem;color:var(--accent);font-variant-numeric:tabular-nums}
/* figure */
.fig{display:block;width:100%;height:auto}
.fig .near,.fig .far,.fig .tor{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .near{stroke:var(--ink);stroke-width:5}
.fig .tor{stroke:var(--ink);stroke-width:6.5}
.fig .far{stroke:var(--muted);stroke-width:5;opacity:.5}
.fig .hd{fill:var(--ink)}
.fig .fl{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.fig .pr{stroke:var(--dusk);stroke-width:3;stroke-linecap:round;fill:none}
.fig .pr.dash{stroke-dasharray:6 5}
.fig .pr.thin{stroke-width:1.6}
.fig .prf{fill:var(--dusk-soft);stroke:var(--dusk);stroke-width:2}
.fig .prc{fill:var(--dusk)}
.thumb{width:62px;flex:none;background:var(--surface-2);border-radius:10px;padding:2px 3px}
.ex summary .n{flex:1;min-width:0}
.figbox{background:var(--surface-2);border-radius:14px;padding:8px 10px}
.ex .figbox{width:100%;max-width:260px;align-self:center}
.vid{color:var(--dusk);font-weight:700;font-size:.88rem;text-decoration:none;align-self:flex-start}
.vid:hover{text-decoration:underline}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:12px;align-items:center}
.stage .figbox{background:var(--surface);padding:10px}
.stage .ringwrap{width:124px;margin:0}
.stage .ringwrap .num b{font-size:2.3rem}
.stage .ringwrap .num span{font-size:.68rem}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div>
      <h1 id="greet">Buongiorno</h1>
      <p id="sub">Quanto tempo hai oggi?</p>
    </div>
    <button class="icon-btn" id="musicBtn" aria-pressed="false" title="Musica di sottofondo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <span id="musicLbl">Musica</span>
    </button>
  </header>

  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sezioni">
  <div class="in">
    <button data-tab="routine" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M5 10c3 1 4.5 1.5 7 1.5S16 11 19 10M12 11.5V16m0 0-3 5m3-5 3 5"/></svg>Routine</button>
    <button data-tab="libreria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></svg>Esercizi</button>
    <button data-tab="storico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="m9 15 2 2 4-4"/></svg>Storico</button>
  </div>
</nav>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="in" id="sheetIn"></div></div>
<div class="player" id="player" hidden><div class="in" id="playerIn"></div></div>

<script>
/* ---------- Esercizi ---------- */
const AREAS = {caviglie:'Caviglie',anche:'Anche',adduttori:'Adduttori e core',colonna:'Colonna',spalle:'Spalle',gambe:'Gambe',respiro:'Respiro',gioco:'Gioco'};
const EX_RAW = [
 ['cerchi_caviglia','Circonduzioni di caviglia','caviglie',30,true,`Seduto o in piedi, solleva un piede e disegna cerchi ampi e lenti con la punta, metà del tempo in un senso e metà nell'altro.`,`Muovi solo la caviglia, il ginocchio resta fermo.`],
 ['alfabeto','Alfabeto con il piede','caviglie',30,true,`Seduto con la gamba sollevata, scrivi in aria le lettere dell'alfabeto con l'alluce.`,`Lettere grandi, movimento lento.`],
 ['caviglia_muro','Ginocchio al muro','caviglie',45,true,`Piede a circa 10 cm dal muro, porta il ginocchio a toccare il muro senza staccare il tallone. Vai avanti e indietro e tieni 2 secondi in fondo.`,`Se tocchi con facilità, allontana il piede di un paio di centimetri.`],
 ['polpaccio','Polpaccio al gradino','caviglie',40,true,`Avampiede sul bordo di un gradino, lascia scendere il tallone sotto il livello del gradino e respira.`,`Gamba tesa, tieniti a un appoggio.`],
 ['soleo','Allungamento del soleo','caviglie',40,true,`In mezzo affondo, piega il ginocchio della gamba dietro tenendo il tallone a terra, finché senti tirare in basso nel polpaccio.`,`Ginocchio piegato, tallone incollato al pavimento.`],
 ['tibiale','Seduto sui talloni','caviglie',40,false,`In ginocchio, siediti sui talloni con il dorso dei piedi a terra. Per aumentare, solleva un poco le ginocchia.`,`Un asciugamano sotto le caviglie se fa male.`],
 ['punte','Salite sulle punte lente','caviglie',40,false,`In piedi, sali sulle punte in 3 secondi e scendi in 3 secondi, usando tutto il movimento.`,`Peso su alluce e secondo dito, non sul bordo esterno.`],
 ['accosciata','Accosciata profonda','caviglie',45,false,`Scendi in squat profondo con i talloni a terra, gomiti dentro le ginocchia, e sposta il peso dolcemente da un piede all'altro.`,`Tieniti a uno stipite se perdi l'equilibrio.`],
 ['fenicottero','Equilibrio su una gamba','caviglie',30,true,`In piedi su una gamba, ginocchio morbido. Quando sei stabile, prova a chiudere gli occhi.`,`Ottimo per la propriocezione su neve e tavola.`],

 ['cerchi_anca',`Cerchi d'anca in quadrupedia`,'anche',40,true,`In quadrupedia, solleva un ginocchio e disegna il cerchio più ampio possibile con l'anca. Tre giri per senso, lentamente.`,`Busto fermo, il movimento nasce solo dall'anca.`],
 ['flessori','Affondo basso per i flessori','anche',45,true,`Ginocchio dietro a terra, spingi il bacino in avanti stringendo il gluteo della gamba dietro. Braccio dello stesso lato verso l'alto.`,`Non inarcare la schiena, pensa a portare il coccige sotto.`],
 ['piccione','Piccione','anche',60,true,`Da quadrupedia porta un ginocchio avanti con la tibia di traverso, gamba dietro distesa. Scendi con il busto quanto è comodo.`,`Se il ginocchio protesta, fai la figura 4 supina.`],
 ['figura4','Figura 4 supina','anche',45,true,`Sdraiato sulla schiena, caviglia sul ginocchio opposto, abbraccia la coscia e portala verso il petto.`,`Spalle e testa rilassate a terra.`],
 ['anca_90','Rotazioni 90/90','anche',45,false,`Seduto con le gambe a 90 gradi, una davanti e una di lato. Ruota le ginocchia da un lato all'altro, senza mani se riesci.`,`Busto alto, movimento lento.`],
 ['world','Affondo con rotazione','anche',45,true,`In affondo lungo, mano opposta a terra e gomito verso la caviglia interna, poi apri il braccio verso il cielo seguendolo con lo sguardo.`,`Il miglior esercizio tutto in uno prima di allenarti.`],
 ['cossack','Cossack squat lento','anche',45,false,`Gambe molto larghe, scendi su un lato con l'altra gamba tesa e la punta verso l'alto. Alterna i lati.`,`Scendi solo fin dove il tallone resta a terra.`],
 ['ponte','Ponte glutei','anche',40,false,`Sdraiato con i piedi a terra, solleva il bacino stringendo i glutei, tieni 2 secondi e scendi vertebra per vertebra.`,`Spingi con i talloni.`],
 ['squat_lento','Squat lento a corpo libero','anche',40,false,`Scendi in 4 secondi, pausa in basso, risali in 2. Ginocchia in linea con le punte.`,`Petto aperto, sguardo avanti.`],

 ['respirazione','Respirazione diaframmatica','respiro',60,false,`Sdraiato con le ginocchia piegate e una mano sulla pancia. Inspira dal naso in 4 secondi gonfiando la pancia, espira in 6 secondi.`,`Lascia andare spalle e mascella.`],
 ['squeeze','Isometria adduttori con cuscino','adduttori',40,false,`Sdraiato con le ginocchia piegate e un cuscino tra le ginocchia. Stringi 5 secondi al 50 per cento, rilascia 5 secondi.`,`Mai fino al dolore. Aumenta la forza solo nelle settimane.`],
 ['ponte_cuscino','Ponte con cuscino','adduttori',40,false,`Come il ponte glutei, stringendo dolcemente un cuscino tra le ginocchia per tutta la salita.`,`Respira, non trattenere il fiato.`],
 ['dead_bug','Dead bug','adduttori',40,false,`Sdraiato, braccia verso il soffitto e ginocchia a 90 gradi. Allunga braccio e gamba opposti senza staccare la zona lombare.`,`Lento e controllato, schiena incollata a terra.`],
 ['adduzione','Adduzione su un fianco','adduttori',35,true,`Sdraiato su un fianco, gamba sopra piegata davanti. Solleva lentamente la gamba sotto, tesa, e riscendi.`,`Movimento piccolo, nessuno strappo.`],
 ['farfalla','Farfalla','adduttori',45,false,`Seduto, piante dei piedi unite e ginocchia aperte. Schiena lunga, lascia scendere le ginocchia con il loro peso.`,`Non spingere le ginocchia con le mani.`],
 ['rocking','Dondolo adduttori','adduttori',40,true,`In quadrupedia con una gamba tesa di lato, porta il bacino indietro verso il tallone e torna avanti, lentamente.`,`Ampiezza minima se senti fastidio all'inguine.`],
 ['copenhagen','Copenhagen facilitato','adduttori',25,true,`Sdraiato su un fianco, ginocchio della gamba sopra appoggiato su una sedia o panca. Solleva il bacino e tieni.`,`Solo senza dolore. Inizia con 10-15 secondi.`],

 ['gatto','Gatto e mucca','colonna',45,false,`In quadrupedia, inspirando inarca la schiena e guarda avanti, espirando arrotonda e porta il mento al petto.`,`Segui il respiro, una vertebra alla volta.`],
 ['libro','Apertura a libro','colonna',40,true,`Sdraiato su un fianco, ginocchia piegate a 90 gradi. Apri il braccio sopra verso il lato opposto seguendolo con lo sguardo.`,`Le ginocchia restano unite a terra.`],
 ['ago',`Infila l'ago`,'colonna',40,true,`In quadrupedia, passa un braccio sotto il corpo appoggiando spalla e tempia a terra, poi riapri verso l'alto.`,`Ottimo per la colonna toracica.`],
 ['bambino','Posizione del bambino','colonna',60,false,`In ginocchio, siediti sui talloni e allunga le braccia in avanti, fronte a terra.`,`Ginocchia larghe per aprire anche le anche.`],
 ['cobra','Cobra morbido','colonna',40,false,`A pancia in giù, appoggia gli avambracci e solleva il petto con dolcezza, bacino a terra.`,`Spalle lontane dalle orecchie.`],
 ['torsione','Torsione supina','colonna',45,true,`Sdraiato, porta le ginocchia piegate da un lato e lo sguardo dal lato opposto, braccia aperte.`,`Lascia che la gravità faccia il lavoro.`],
 ['preghiera','Allungamento toracico alla panca','colonna',45,false,`In ginocchio davanti a una sedia o panca, gomiti appoggiati e mani unite. Porta il petto verso il pavimento.`,`Porta le mani dietro la testa per aumentare.`],

 ['cerchi_braccia','Cerchi di braccia','spalle',30,false,`Braccia tese, cerchi prima piccoli poi grandi, in avanti e poi indietro.`,`Collo rilassato.`],
 ['pass_through','Pass-through con bastone','spalle',40,false,`Impugna largo un bastone o un elastico e portalo da davanti a dietro la schiena con le braccia tese.`,`Allarga la presa se piegano i gomiti.`],
 ['wall_slide','Wall slide','spalle',40,false,`Schiena e braccia al muro a forma di W, fai scivolare le braccia in alto fino alla Y senza staccarle.`,`Coste giù, non inarcare la schiena.`],
 ['pettorale','Pettorale allo stipite','spalle',40,true,`Avambraccio sullo stipite di una porta, gomito all'altezza della spalla, ruota il busto verso l'esterno.`,`Cambia altezza del gomito per lavorare zone diverse.`],
 ['dorsale','Gran dorsale al muro','spalle',40,true,`Mani su un muro o un tavolo, fai un passo indietro e spingi le anche indietro abbassando il busto, poi spostati verso un lato.`,`Allunga dal fianco fino all'ascella.`],
 ['sleeper','Sleeper stretch','spalle',35,true,`Sdraiato su un fianco, braccio sotto a 90 gradi. Con l'altra mano porta dolcemente l'avambraccio verso il pavimento.`,`Molto dolce, è un allungamento sensibile.`],
 ['scap_push','Push-up scapolari','spalle',35,false,`In plank sulle mani a braccia tese, avvicina e allontana le scapole senza piegare i gomiti.`,`Movimento piccolo e controllato.`],

 ['ischio','Ischiocrurali supino','gambe',45,true,`Sdraiato, solleva una gamba tesa aiutandoti con un elastico o un asciugamano sotto il piede.`,`L'altra gamba resta distesa a terra.`],
 ['quadricipite','Quadricipite','gambe',40,true,`In piedi o su un fianco, afferra la caviglia e porta il tallone verso il gluteo, bacino in retroversione.`,`Ginocchia vicine.`],
 ['slanci','Slanci avanti e indietro','gambe',30,true,`Appoggiato a un muro, slancia una gamba avanti e indietro aumentando l'ampiezza poco alla volta.`,`Busto fermo.`],
 ['slanci_lat','Slanci laterali','gambe',30,true,`Di fronte al muro, slancia una gamba da un lato all'altro davanti al corpo.`,`Ampiezza progressiva.`],
 ['inchworm','Bruco','gambe',40,false,`In piedi, piegati e cammina con le mani fino al plank, poi torna indietro con le mani verso i piedi.`,`Gambe il più tese possibile.`],

 ['k_stella','Stella marina','gioco',25,false,`In piedi, aprite braccia e gambe a stella e allungatevi più che potete, poi chiudetevi a pallina. Ripetete.`,`Chi diventa la stella più grande?`],
 ['k_orso',`Camminata dell'orso`,'gioco',30,false,`Mani e piedi a terra, sedere in alto, camminate per la stanza come due orsi.`,`L'orso è tranquillo, andate piano.`],
 ['k_granchio','Camminata del granchio','gioco',30,false,`Seduti con le mani dietro, sollevate il bacino e camminate di lato.`,`Gara di lentezza!`],
 ['k_fenicottero','Fenicottero','gioco',20,true,`Su una gamba sola con le braccia aperte come ali. Chi resta in equilibrio più a lungo?`,`Guardate un punto fisso davanti.`],
 ['k_gatto','Gatto arrabbiato e mucca felice','gioco',40,false,`A quattro zampe, il gatto arrabbiato fa la gobba, la mucca felice abbassa la pancia e fa muu.`,`Con i versi è molto più divertente.`],
 ['k_farfalla','Farfalla che vola','gioco',30,false,`Seduti con i piedi uniti, muovete le ginocchia come ali di farfalla.`,`Prima lento, poi veloce, poi lentissimo.`],
 ['k_serpente','Serpente','gioco',30,false,`A pancia in giù, sollevate il petto e fate ssss come un serpente.`,`Spalle basse.`],
 ['k_rana','Rana','gioco',30,false,`Accosciati come rane, saltate piano in avanti e tornate giù.`,`Atterrate morbidi.`],
 ['k_albero','Albero','gioco',20,true,`Piede appoggiato sul polpaccio dell'altra gamba, mani unite sopra la testa come rami.`,`Gli alberi possono oscillare al vento.`],
 ['k_leone','Il leone che dorme','gioco',40,false,`Sdraiati a pancia in su, occhi chiusi, respirate lenti e fate finta di dormire.`,`Chi si muove per primo?`],
];

function plan(r,minutes){
  const tier=minutes<=5?1:minutes<=10?2:3;
  let items=r.list.map(([id,t])=>({id,t:r.custom?1:t})).filter(x=>x.t<=tier&&EX[x.id]);
  let factor=1;
  for(;;){
    const preps=items.reduce((a,x)=>a+PREP+(EX[x.id].b?SWITCH:0),0);
    const base=items.reduce((a,x)=>a+EX[x.id].s*(EX[x.id].b?2:1),0);
    factor=(minutes*60-preps)/base;
    const minS=Math.min(...items.map(x=>EX[x.id].s));
    if(factor*minS<20&&items.length>3){
      let k=-1,mt=-1; items.forEach((x,i)=>{if(x.t>=mt){mt=x.t;k=i}});
      if(k===items.length-1&&items.length>1&&items[k].id==='bambino'){k=items.length-2}
      items.splice(k,1); continue;
    }
    break;
  }
  const r5=v=>Math.round(v/5)*5;
  items=items.map(x=>({...x,secs:Math.max(20,Math.min(150,r5(EX[x.id].s*factor)))}));
  const steps=[];
  items.forEach(x=>{
    const sides=EX[x.id].b?['dx','sx']:[null];
    sides.forEach((sd,i)=>{
      steps.push({type:'prep',ex:x.id,side:sd,secs:i===0?PREP:SWITCH,sw:i>0});
      steps.push({type:'work',ex:x.id,side:sd,secs:x.secs});
    });
  });
  const total=steps.reduce((a,s)=>a+s.secs,0);
  return {items,steps,total};
}

  $('#sub').textContent='I tuoi progressi';
  const mon=mondayOf(new Date());
  const week=S.hist.filter(h=>new Date(h.t)>=mon);
  const wMin=Math.round(week.reduce((a,h)=>a+h.sec,0)/60);
  const byDay={};S.hist.forEach(h=>{const k=dkey(new Date(h.t));byDay[k]=(byDay[k]||0)+h.sec/60});
  const start=new Date(mon);start.setDate(start.getDate()-21);
  const today=dkey(new Date());let cells='';
  for(let i=0;i<28;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=dkey(d);const m=byDay[k]||0;
    const lv=m===0?'':m<8?'l1':m<15?'l2':'l3';const fut=d>new Date();
    cells+=`<div class="d ${lv} ${k===today?'today':''} ${fut?'fut':''}" title="${k}">${d.getDate()}</div>`;
  }
  const recent=[...S.hist].reverse().slice(0,15);
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:20px">
    <div class="stats">
      <div class="stat"><span class="v">${streak()}</span><span class="k">giorni di fila</span></div>
      <div class="stat"><span class="v">${week.length}</span><span class="k">sessioni in settimana</span></div>
      <div class="stat"><span class="v">${wMin}</span><span class="k">minuti in settimana</span></div>
    </div>
    <section class="section"><span class="label">Ultime 4 settimane</span>
      <div class="cal">${['L','M','M','G','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div></section>
    <section class="section"><span class="label">Sessioni recenti</span>
      ${recent.length?`<div class="list">${recent.map(h=>{const d=new Date(h.t);return `<div class="hrow"><div><div class="t">${esc(h.r)}</div><div class="s">${d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}, ${d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}${h.done?'':' · interrotta'}</div></div><div class="r">${fmtMin(h.sec)}</div></div>`}).join('')}</div>`
      :`<div class="empty">Qui comparirà ogni sessione completata, con la serie di giorni consecutivi.<br>Parti con 5 minuti dalla scheda Routine.</div>`}
    </section></div>`;
}
function setTab(t){
  S.tab=t;
  document.querySelectorAll('nav.tabs button').forEach(b=>{if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  ({routine:renderRoutine,libreria:renderLibrary,storico:renderHistory})[t]();window.scrollTo(0,0);
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#musicBtn').onclick=()=>setMusic(!S.music);

/* ---------- Sheet ---------- */
function openSheet(html,bind){
  $('#sheetIn').innerHTML='<div class="grab"></div>'+html;
  $('#backdrop').hidden=false;$('#sheet').hidden=false;
  requestAnimationFrame(()=>{$('#backdrop').classList.add('on');$('#sheet').classList.add('on')});
  $('#sheet').scrollTop=0;bind&&bind($('#sheetIn'));
}
function closeSheet(){
  $('#backdrop').classList.remove('on');$('#sheet').classList.remove('on');
  setTimeout(()=>{$('#backdrop').hidden=true;$('#sheet').hidden=true},300);
}
$('#backdrop').onclick=closeSheet;

function openDetail(id){
  const r=getRoutine(id);if(!r)return;
  const draw=()=>{
    const p=plan(r,S.dur);
    openSheet(`<h2>${esc(r.name)}</h2><p class="rdesc">${esc(r.desc)}</p>
      ${r.note?`<div class="note">${r.note}</div>`:''}
      ${segHTML('segD')}
      <div class="steps">${p.items.map(x=>`<div class="row"><span>${EX[x.id].n}</span><span>${x.secs} s${EX[x.id].b?' × 2 lati':''}</span></div>`).join('')}</div>
      <button class="btn" id="go">Inizia · ${fmtMin(p.total)}</button>
      ${r.custom?`<button class="btn danger" id="del">Elimina routine</button>`:''}`,root=>{
      bindSeg(root,()=>{draw();if(S.tab==='routine')renderRoutine()});
      root.querySelector('#go').onclick=()=>{closeSheet();startSession(r)};
      const del=root.querySelector('#del');
      if(del)del.onclick=()=>{
        if(del.dataset.armed){S.custom=S.custom.filter(c=>c.id!==r.id);LS.set('fm_custom',S.custom);closeSheet();renderRoutine()}
        else{del.dataset.armed='1';del.textContent='Tocca di nuovo per eliminare'}
      };
    });
  };
  draw();
}

function openBuilder(){
  const B={name:'',items:[]};
  const draw=()=>{
    const groups=Object.keys(AREAS).map(a=>{
      const xs=EX_RAW.map(r=>EX[r[0]]).filter(e=>e.a===a);
      return `<span class="label">${AREAS[a]}</span>${xs.map(e=>{const i=B.items.indexOf(e.id);return `<div class="pick ${i>=0?'sel':''}"><div><div class="n">${i>=0?`<span class="ord">${i+1}</span>`:''}${e.n}</div><div class="a">${e.s} s${e.b?' per lato':''}</div></div><button data-ex="${e.id}" aria-label="${i>=0?'Togli':'Aggiungi'} ${esc(e.n)}">${i>=0?'−':'+'}</button></div>`}).join('')}`;
    }).join('');
    const nameVal=B.name;
    openSheet(`<h2>Nuova routine</h2>
      <div class="field"><label class="label" for="cname">Nome</label><input id="cname" maxlength="40" placeholder="Es. Spalle prima del kite" value="${esc(nameVal)}"></div>
      <p class="rdesc">Tocca + negli esercizi nell'ordine in cui vuoi farli. La durata si adatta da sola a 5, 10 o 15 minuti.</p>
      <button class="btn" id="save" ${B.items.length<2||!B.name.trim()?'disabled':''}>Salva routine${B.items.length?` · ${B.items.length} esercizi`:''}</button>
      <div class="list">${groups}</div>`,root=>{
      const inp=root.querySelector('#cname');
      inp.oninput=()=>{B.name=inp.value;root.querySelector('#save').disabled=B.items.length<2||!B.name.trim()};
      root.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{
        const id=b.dataset.ex,i=B.items.indexOf(id);i>=0?B.items.splice(i,1):B.items.push(id);
        const st=$('#sheet').scrollTop;draw();$('#sheet').scrollTop=st;
      });
      root.querySelector('#save').onclick=()=>{
        const r={id:'c'+Date.now(),name:B.name.trim(),desc:B.items.slice(0,3).map(id=>EX[id].n).join(', ')+(B.items.length>3?' e altri':''),list:B.items.map(id=>[id,1])};
        S.custom.push(r);LS.set('fm_custom',S.custom);closeSheet();renderRoutine();
      };
    });
  };
  draw();
}

/* ---------- Player ---------- */
let P=null,TI=null;
const sideTxt=s=>s==='dx'?'Lato destro':s==='sx'?'Lato sinistro':'';
const ICON={
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  music:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  voice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>'
};
const C=2*Math.PI*88;
function startSession(r){
  const p=plan(r,S.dur);
  ensureAudio();wake();
  P={r,steps:p.steps,total:p.total,i:0,endAt:0,remain:0,paused:false,work:0,done:false,ask:false};
  $('#player').hidden=false;document.body.style.overflow='hidden';
  drawPlayerShell();enterStep(0);
  clearInterval(TI);TI=setInterval(loop,200);
}
function drawPlayerShell(){
  $('#playerIn').innerHTML=`
    <div class="pbar"><button class="round" id="pClose" aria-label="Termina">${ICON.close}</button>
      <div class="ttl">${esc(P.r.name)}</div>
      <button class="round" id="pVoice" aria-pressed="${S.voice}" aria-label="Voce guida">${ICON.voice}</button>
      <button class="round" id="pMusic" aria-pressed="${S.music}" aria-label="Musica">${ICON.music}</button></div>
    <div class="prog"><i id="pProg"></i></div>
    <div id="pAsk"></div>
    <div class="phase" id="pPhase"></div>
    <h2 class="exname" id="pName"></h2>
    <div class="stage"><div class="figbox" id="pFig"></div><div class="ringwrap" id="pRing"><div class="breath"></div>
      <svg viewBox="0 0 200 200"><circle class="trk" cx="100" cy="100" r="88"/><circle class="val" id="pVal" cx="100" cy="100" r="88" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
      <div class="num"><b id="pNum">0</b><span id="pUnit">secondi</span></div></div></div>
    <div class="how"><p id="pHow"></p><p class="tip" id="pTip"></p><a class="vid" id="pVid" target="_blank" rel="noopener">Guarda un video su YouTube <span aria-hidden="true">↗</span></a></div>
    <p class="nextup" id="pNext"></p>
    <div class="ctrls"><button class="round" id="pPrev" aria-label="Indietro">${ICON.prev}</button>
      <button class="round main" id="pPlay" aria-label="Pausa">${ICON.pause}</button>
      <button class="round" id="pSkip" aria-label="Avanti">${ICON.next}</button></div>`;
  $('#pClose').onclick=askExit;
  $('#pMusic').onclick=()=>setMusic(!S.music);
  $('#pVoice').onclick=()=>{S.voice=!S.voice;LS.set('fm_voice',S.voice);$('#pVoice').setAttribute('aria-pressed',S.voice);if(!S.voice&&'speechSynthesis' in window)speechSynthesis.cancel()};
  $('#pPlay').onclick=togglePause;
  $('#pSkip').onclick=()=>{leaveStep();P.i+1>=P.steps.length?finish(true):enterStep(P.i+1)};
  $('#pPrev').onclick=()=>{leaveStep();const st=P.steps[P.i];let j=st.type==='work'?P.i-1:P.i-2;enterStep(Math.max(0,j))};
}
function leaveStep(){
  const st=P.steps[P.i];if(st.type!=='work')return;
  const rem=P.paused?P.remain:(P.endAt-Date.now())/1000;P.work+=Math.max(0,Math.min(st.secs,st.secs-rem));
}
function enterStep(i){
  P.i=i;const st=P.steps[i],ex=EX[st.ex];
  P.remain=st.secs;P.endAt=Date.now()+st.secs*1000;P.lastBeep=null;
  if(P.paused){P.paused=false;syncPlay()}
  const nextW=P.steps.slice(i+1).find(s=>s.type==='work'&&!(s.ex===st.ex&&st.type==='prep'));
  $('#pPhase').className='phase'+(st.type==='prep'?' prep':'');
  $('#pPhase').textContent=st.type==='prep'?(st.sw?'Cambia lato':'Preparati'):(sideTxt(st.side)||'Vai');
  $('#pName').textContent=ex.n;
  $('#pRing').classList.toggle('prep',st.type==='prep');
  $('#pUnit').textContent=st.type==='prep'?'si parte tra':'secondi';
  $('#pHow').textContent=ex.how;$('#pTip').textContent=ex.tip;$('#pVid').href=vidURL(st.ex);
  if($('#pFig').dataset.cur!==st.ex){$('#pFig').dataset.cur=st.ex;animate($('#pFig'),st.ex)}
  $('#pNext').innerHTML=nextW&&st.type==='work'?`Dopo: <b>${EX[nextW.ex].n}</b>${nextW.side&&nextW.ex===st.ex?' · '+sideTxt(nextW.side).toLowerCase():''}`:(st.type==='prep'&&st.side?sideTxt(st.side):'');
  if(st.type==='prep')speak(st.sw?'Cambia lato':(i===0?'Iniziamo. ':'Prossimo: ')+ex.n+(st.side?', '+sideTxt(st.side).toLowerCase():''));
  else chime();
  draw();
}
function draw(){
  const st=P.steps[P.i];const rem=P.paused?P.remain:Math.max(0,(P.endAt-Date.now())/1000);
  $('#pNum').textContent=Math.ceil(rem);
  $('#pVal').setAttribute('stroke-dashoffset',C*(1-rem/st.secs));
  const before=P.steps.slice(0,P.i).reduce((a,s)=>a+s.secs,0);
  $('#pProg').style.width=((before+st.secs-rem)/P.total*100)+'%';
}
function loop(){
  if(!P||P.done||P.paused)return;
  const rem=(P.endAt-Date.now())/1000,sec=Math.ceil(rem);
  if(sec<=3&&sec>=1&&P.lastBeep!==sec){P.lastBeep=sec;tick()}
  if(rem<=0){leaveStep();if(P.i+1>=P.steps.length)finish(true);else enterStep(P.i+1);return}
  draw();
}
function togglePause(){
  if(P.paused){P.endAt=Date.now()+P.remain*1000;P.paused=false}
  else{P.remain=Math.max(0,(P.endAt-Date.now())/1000);P.paused=true;if('speechSynthesis' in window)speechSynthesis.cancel()}
  syncPlay();draw();
}
function syncPlay(){const b=$('#pPlay');if(!b)return;b.innerHTML=P.paused?ICON.play:ICON.pause;b.setAttribute('aria-label',P.paused?'Riprendi':'Pausa')}
function askExit(){
  if(!P.paused)togglePause();
  $('#pAsk').innerHTML=`<div class="confirm"><p><b>Vuoi terminare la sessione?</b> ${P.work>=30?'Salverò i minuti fatti finora.':''}</p>
    <div class="row2"><button class="btn ghost" id="aNo">Continua</button><button class="btn" id="aYes">Termina</button></div></div>`;
  $('#aNo').onclick=()=>{$('#pAsk').innerHTML='';togglePause()};
  $('#aYes').onclick=()=>{finish(false)};
}
function finish(completed){
  clearInterval(TI);P.done=true;unwake();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  if(P.work>=30){S.hist.push({t:new Date().toISOString(),r:P.r.name,rid:P.r.id,sec:Math.round(P.work),done:completed});LS.set('fm_hist',S.hist)}
  if(!completed){closePlayer();return}
  endChime();speak('Sessione completata. Ottimo lavoro.');
  $('#playerIn').innerHTML=`<div class="done"><span class="label">Sessione completata</span><h2>${esc(P.r.name)}</h2>
    <div class="big">${fmtMin(P.work)}</div><p class="rdesc">Serie attuale: <b>${streak()} ${streak()===1?'giorno':'giorni'}</b> di fila. Bevi un bicchiere d'acqua e goditi la sensazione.</p>
    <button class="btn" id="dOk">Chiudi</button></div>`;
  $('#dOk').onclick=closePlayer;
}
function closePlayer(){
  clearInterval(TI);unwake();P=null;$('#player').hidden=true;document.body.style.overflow='';setTab(S.tab);
}

greet();setTab('routine');
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
